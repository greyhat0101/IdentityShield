<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
</head>
<body>
<div style="font-family:Arial,sans-serif;max-width:600px;margin:auto;background:#f9f9f9;padding:30px;border-radius:10px;">
    <div style="background:#0a0f1e;padding:20px;border-radius:8px;text-align:center;margin-bottom:20px;">
        <h2 style="color:#00ff88;font-family:monospace;margin:0;">IDENTITY<span style="color:#fff;">SHIELD</span></h2>
        <p style="color:#8a9ab0;font-size:12px;margin:4px 0 0;">Support Team</p>
    </div>
    <p style="color:#333;">Hi <strong>{{ name }}</strong>,</p>
    <p style="color:#555;">Thank you for contacting IdentityShield Support.</p>
    <div style="background:#fff;border-left:4px solid #ccc;padding:14px;margin:16px 0;border-radius:4px;">
        <p style="font-size:12px;color:#888;margin:0 0 6px;">YOUR QUERY</p>
        <p style="color:#333;margin:0;">{{ query_message }}</p>
    </div>
    <div style="background:#fff;border-left:4px solid #00ff88;padding:14px;margin:16px 0;border-radius:4px;">
        <p style="font-size:12px;color:#888;margin:0 0 6px;">OUR REPLY</p>
        <p style="color:#333;margin:0;">{{ reply }}</p>
    </div>
    <p style="color:#555;">If you have further questions feel free to reach out again.</p>
    <p style="color:#333;">&mdash; <strong>Team IdentityShield</strong></p>
    <div style="text-align:center;margin-top:20px;font-size:11px;color:#aaa;">
        &copy; 2026 IdentityShield &mdash; All Rights Reserved
    </div>
</div>
</body>
</html>
