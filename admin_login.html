<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>IdentityShield Admin Login</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;800;900&family=Rajdhani:wght@300;400;500;600;700&family=Share+Tech+Mono&family=Exo+2:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="../static/css/style.css"/>
  <link rel="stylesheet" href="../static/css/admin_login.css"/>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;800&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
 <link rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}">
       <link rel="stylesheet"
      href="{{ url_for('static', filename='css/admin_login.css') }}">

</head>


<body>

<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <div class="login-logo-icon">🛡️</div>
      <div class="login-logo-text">ADMIN<span>PANEL</span></div>
    </div>
    <div class="login-subtitle">Secure Access Required</div>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label class="form-label" for="email">Admin Email</label>
        <input 
          type="email" 
          id="email" 
          class="form-input" 
          placeholder="admin@identityshield.com"
          required
          autocomplete="email"
        />
        <div class="form-error" id="email-error"></div>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <div class="password-group">
          <input 
            type="password" 
            id="password" 
            class="form-input" 
            placeholder="Enter your password"
            required
            autocomplete="current-password"
          />
          <button type="button" class="password-toggle" onclick="togglePasswordVisibility()">
            <i class="fas fa-eye" id="eye-icon"></i>
          </button>
        </div>
        <div class="form-error" id="password-error"></div>
      </div>

      <div class="remember-group">
        <input type="checkbox" id="rememberMe" class="checkbox-custom"/>
        <label for="rememberMe" style="cursor: pointer; margin: 0;">Remember me</label>
      </div>

      <button type="submit" class="login-btn" id="loginBtn">
        <i class="fas fa-lock me-2"></i>LOGIN
      </button>
    </form>

    <!-- <div class="login-footer">
      <p>For security purposes, default credentials are:</p>
      <p><strong>Email:</strong> admin@identityshield.com<br><strong>Password:</strong> Admin@123</p>
      <p style="margin-top: 12px;">⚠️ Change password after first login</p>
    </div> -->
  </div>
</div>

<div id="toast" class="toast-notify">
  <span class="toast-icon">✓</span>
  <span id="toastMessage"></span>
</div>

      
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
<script src="{{ url_for('static', filename='js/admin.js') }}"></script>

</body>
</html>
